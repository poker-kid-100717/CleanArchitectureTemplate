name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: CleanArchitectureTemplate

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start SQL Server 2022 with Testcontainers on the
      # runner's Docker daemon.
      - name: Dependency vulnerability report
        run: dotnet list package --vulnerable --include-transitive

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Check EF Core migrations are up to date
        run: |
          dotnet tool install --global dotnet-ef --version 10.*
          dotnet ef migrations has-pending-model-changes --configuration Release -p src/Infrastructure -s src/WebUI

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CleanArchitectureTemplate/src/WebUI/ClientApp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: CleanArchitectureTemplate/src/WebUI/ClientApp/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx ng build
      - run: npx ng test --watch=false

  cloudflare:
    name: Cloudflare deploy dry-run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bash -n scripts/cloudflare-deploy.sh
      - run: bash scripts/cloudflare-deploy.sh
        env:
          VALIDATE_ONLY: "true"
          APP_HOST: todo.example.com
          DATABASE_URL: "Server=tcp:dry-run.database.windows.net,1433;Database=CleanArchitectureDb;User ID=dry-run;Password=dry-run;Encrypt=True"

name: deploy-cloudflare

# Deploys the app (Worker serving Angular + .NET API in a Cloudflare Container) to Cloudflare.
# Skips cleanly until the Cloudflare secrets exist.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host:
        description: Custom hostname (for example todo.example.com). Leave empty to use APP_HOST or workers.dev.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clean-architecture-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy secrets
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets to enable deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '24'

      - name: Build, deploy, and smoke test
        if: steps.config.outputs.ready == 'true'
        run: bash scripts/cloudflare-deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_HOST: ${{ inputs.host || vars.APP_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
